name: Build Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'handbook/**'
      - 'website/**'
      - '.github/workflows/build-check.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: 'build-check-${{ github.head_ref || github.run_id }}'
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: |
          test -f build/index.html || { echo "build/index.html missing"; exit 1; }
          grep -q '/Poweramp-Player-Technical-Handbook/' build/index.html || { echo "baseUrl missing in build/index.html"; exit 1; }
