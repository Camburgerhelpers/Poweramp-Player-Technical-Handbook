version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Wait after a new release before creating a PR to reduce supply-chain risk
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Wait after a new release before creating a PR to reduce supply-chain risk
    cooldown:
      default-days: 7
